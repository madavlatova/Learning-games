<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Хогвартс: Магия Чисел</title>
    <style>
        body {
            font-family: 'Georgia', serif;
            background-color: #1a1a2e;
            background-image: radial-gradient(circle at top, #2a2a4e, #0f0f1a);
            color: #f1c40f;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        #game-container {
            background: rgba(20, 20, 35, 0.9);
            border-radius: 15px;
            padding: 40px;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 0 30px rgba(241, 196, 15, 0.2);
            border: 2px solid #d4af37;
        }
        h1 {
            color: #d4af37;
            margin-top: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 24px;
        }
        .level-title {
            color: #bdc3c7;
            font-size: 18px;
            margin-bottom: 10px;
            font-style: italic;
        }
        .streak-indicator {
            color: #2ecc71;
            font-size: 14px;
            margin-bottom: 25px;
            height: 20px;
        }
        #problem {
            font-size: 48px;
            font-weight: bold;
            color: #fff;
            margin: 20px 0;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }
        input {
            font-size: 32px;
            padding: 10px;
            width: 120px;
            text-align: center;
            background: #2c3e50;
            color: #f1c40f;
            border: 2px solid #d4af37;
            border-radius: 8px;
            outline: none;
            font-family: 'Georgia', serif;
        }
        input:focus {
            box-shadow: 0 0 15px #d4af37;
        }
        button {
            background-color: #8e44ad;
            color: white;
            border: 2px solid #9b59b6;
            padding: 15px 35px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 25px;
            transition: all 0.3s;
            font-family: 'Georgia', serif;
            letter-spacing: 1px;
        }
        button:hover {
            background-color: #9b59b6;
            box-shadow: 0 0 20px rgba(155, 89, 182, 0.6);
            transform: scale(1.05);
        }
        #message {
            margin-top: 25px;
            font-size: 20px;
            height: 30px;
        }
        .magic-sparks {
            font-size: 40px;
            margin-top: 30px;
            min-height: 60px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <h1>⚡ Хогвартс: Магия Чисел 🦉</h1>
        <div class="level-title" id="level-display">Уровень 1: Магия Зеркала</div>
        <div class="streak-indicator" id="streak-display"></div>
        
        <div id="problem">? × ? =</div>
        <input type="number" id="answer" placeholder="?" autocomplete="off">
        <br>
        <button onclick="checkAnswer()">Люмос!</button>
        
        <div id="message"></div>
        
        <div class="magic-sparks" id="garden"></div>
    </div>

    <script>
        let num1, num2;
        let currentLevel = 1;
        let consecutiveCorrect = 0;
        const maxLevel = 5;
        const answersToLevelUp = 3;
        const garden = document.getElementById('garden');

        const levelNames = {
            1: "Уровень 1: Основы (на 1 и 10)",
            2: "Уровень 2: Удвоение и Пятерки (на 2 и 5)",
            3: "Уровень 3: Средняя магия (на 3 и 4)",
            4: "Уровень 4: Продвинутая магия (смешанные)",
            5: "Уровень 5: Высшие зелья (на 6, 7, 8, 9)"
        };

        function updateUI() {
            document.getElementById('level-display').innerText = levelNames[currentLevel];
            
            let stars = "";
            for(let i=0; i<consecutiveCorrect; i++) stars += "⭐";
            document.getElementById('streak-display').innerText = stars ? "Серия: " + stars : "";
        }

        function generateProblem() {
            // Адаптивная логика выбора множителей
            switch(currentLevel) {
                case 1: // На 1 и 10
                    num1 = Math.floor(Math.random() * 10) + 1;
                    num2 = Math.random() > 0.5 ? 1 : 10;
                    break;
                case 2: // На 2 и 5
                    num1 = Math.floor(Math.random() * 10) + 1;
                    num2 = Math.random() > 0.5 ? 2 : 5;
                    break;
                case 3: // На 3 и 4
                    num1 = Math.floor(Math.random() * 10) + 1;
                    num2 = Math.random() > 0.5 ? 3 : 4;
                    break;
                case 4: // Сложные цифры, но с легкими множителями (от 1 до 5)
                    num1 = Math.floor(Math.random() * 5) + 1;
                    num2 = Math.floor(Math.random() * 4) + 6; // 6, 7, 8, 9
                    break;
                case 5: // Самые сложные примеры (от 6х6 до 9х9)
                    num1 = Math.floor(Math.random() * 4) + 6;
                    num2 = Math.floor(Math.random() * 4) + 6;
                    break;
            }
            
            // Случайный порядок множителей (переместительное свойство)
            if (Math.random() > 0.5) {
                let temp = num1;
                num1 = num2;
                num2 = temp;
            }
            
            updateUI();
            document.getElementById('problem').innerText = num1 + ' × ' + num2 + ' = ';
            document.getElementById('answer').value = '';
            document.getElementById('message').innerText = '';
            document.getElementById('answer').focus();
        }

        function checkAnswer() {
            let userAnswer = parseInt(document.getElementById('answer').value);
            let correctAnswer = num1 * num2;
            let messageEl = document.getElementById('message');

            if (userAnswer === correctAnswer) {
                consecutiveCorrect++;
                messageEl.style.color = '#f1c40f';
                
                let spark = document.createElement('span');
                spark.innerText = '✨';
                garden.appendChild(spark);
                if (garden.children.length > 8) garden.innerHTML = '✨';

                // Логика повышения уровня
                if (consecutiveCorrect >= answersToLevelUp && currentLevel < maxLevel) {
                    currentLevel++;
                    consecutiveCorrect = 0;
                    messageEl.innerText = '🌟 Уровень повышен! Новые чары!';
                    garden.innerHTML = ''; // Очищаем искры при переходе
                } else {
                    messageEl.innerText = '✨ 10 очков твоему факультету!';
                }

                setTimeout(generateProblem, 1500);
            } else {
                // Логика понижения уровня
                consecutiveCorrect = 0;
                messageEl.style.color = '#e74c3c'; 
                
                if (currentLevel > 1) {
                    currentLevel--;
                    messageEl.innerText = 'Ой! Слишком сложно. Давай повторим прошлые чары 🪄';
                } else {
                    messageEl.innerText = 'Сконцентрируйся и взмахни палочкой еще раз! 🪄';
                }
                
                updateUI();
                // Не даем новый пример, пока не решит текущий, или можно дать новый с пониженным уровнем
                setTimeout(generateProblem, 2000); 
            }
        }

        generateProblem();
        
        document.getElementById('answer').addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                checkAnswer();
            }
        });
    </script>

</body>
</html>
